name: Bootstrap BuilderSignal source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore application source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part00 .bootstrap/part01 .bootstrap/part02 .bootstrap/part03 .bootstrap/part04 > /tmp/builder-signal.b64
          base64 --decode /tmp/builder-signal.b64 > /tmp/builder-signal.tgz
          tar -xzf /tmp/builder-signal.tgz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/ci.yml
      - name: Commit hydrated application source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows/**'
          if git diff --cached --quiet; then
            echo 'No application changes to commit'
            exit 0
          fi
          git commit -m 'feat: ship BuilderSignal production MVP'
          git push origin HEAD:main
