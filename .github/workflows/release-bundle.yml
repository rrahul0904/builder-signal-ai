name: Release bundle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-bundle.yml'

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refuse stale release candidates
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
      - name: Generate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already current'
          else
            git commit -m 'chore: add deterministic dependency lockfile'
            git push origin HEAD:main
          fi
      - name: Build source archive
        shell: bash
        run: tar --exclude='.git' --exclude='node_modules' -czf /tmp/builder-signal-release.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: builder-signal-release
          path: /tmp/builder-signal-release.tgz
          if-no-files-found: error
          retention-days: 1
